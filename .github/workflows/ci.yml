name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.6"
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.13.6"
      - run: uv sync --frozen --group dev
      - run: uv run pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:renderer-test
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run build:renderer-test

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - name: Verify HTTP startup and persisted option workflow
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://localhost:8000/api/v1"

          def request(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + path, data=data, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)

          # Compose waits for PostgreSQL health; these development HTTP services
          # have no container healthchecks, so wait for their actual listeners.
          for url in (base + "/health", "http://localhost:5173"):
              for attempt in range(60):
                  try:
                      with urllib.request.urlopen(url, timeout=2) as response:
                          assert response.status == 200
                      break
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      if attempt == 59:
                          raise
                      time.sleep(1)
          assert request("/health") == {"status": "healthy"}
          constraints = {"setback_m": 1, "floor_to_floor_m": 3.5, "max_floors": 6}
          sites = (
              [[0, 0], [40, 0], [40, 25], [0, 25], [0, 0]],
              [[0, 0], [30, 0], [30, 10], [10, 10], [10, 30], [0, 30], [0, 0]],
          )
          for ring in sites:
              configuration = {"site": {"type": "Polygon", "coordinates": [ring]}, "hard_constraints": constraints}
              preview = request("/massing/preview", configuration)
              assert preview["feasibility"]["hard_constraints_satisfied"] is True
              assert preview["metrics"]["footprint_area_m2"] > 0
          root = request("/options", {**configuration, "name": "Compose smoke root"})
          child = request("/options/" + root["id"] + "/branches", {
              "hard_constraints": {**constraints, "max_floors": 3}, "name": "Compose smoke child",
          })
          assert child["parent_id"] == root["id"]
          assert request("/options/" + root["id"]) == root
          tree = request("/options/tree?root_id=" + root["id"])
          assert [node["id"] for node in tree["children"]] == [child["id"]]
          comparison = request("/options/compare", {"option_ids": [root["id"], child["id"]]})
          assert comparison["options"] == [root, child]
          print("Compose smoke passed: health, frontend, rectangular/concave preview, save, branch, retrieval, tree, compare.")
          PY
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
